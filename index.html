<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para minha Irina 💗</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: "Arial Rounded MT Bold", Arial, sans-serif;
        background: linear-gradient(135deg, #ffb6d9, #ffd6eb, #ff9dcc);
        color: #8f285b;
    }

    .card {
        width: 90%;
        max-width: 390px;
        padding: 35px 25px;
        text-align: center;
        background: rgba(255,255,255,0.82);
        border-radius: 30px;
        box-shadow: 0 15px 40px rgba(170, 45, 100, 0.25);
        position: relative;
        z-index: 2;
    }

    h1 {
        margin: 0 0 10px;
        font-size: 30px;
    }

    .subtitle {
        font-size: 17px;
        margin-bottom: 25px;
    }

    .love {
        font-size: 27px;
        font-weight: bold;
        margin: 20px 0 8px;
    }

    .saudade {
        font-size: 18px;
        margin-bottom: 25px;
    }

    button {
        border: none;
        background: #ff72ad;
        color: white;
        padding: 13px 18px;
        margin: 6px;
        border-radius: 25px;
        font-size: 15px;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 5px 12px rgba(180, 40, 100, .2);
        transition: .2s;
    }

    button:hover {
        transform: scale(1.08);
        background: #f45196;
    }

    #mensagem {
        min-height: 35px;
        margin-top: 20px;
        font-size: 18px;
        font-weight: bold;
    }

    .hearts {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
    }

    .heart {
        position: absolute;
        bottom: -30px;
        animation: subir 6s linear infinite;
        opacity: .7;
        font-size: 22px;
    }

    @keyframes subir {
        0% {
            transform: translateY(0) rotate(0);
            opacity: 0;
        }
        20% {
            opacity: .8;
        }
        100% {
            transform: translateY(-110vh) rotate(360deg);
            opacity: 0;
        }
    }

    .assinatura {
        margin-top: 25px;
        font-size: 15px;
    }
</style>
</head>

<body>

<div class="hearts">
    <span class="heart" style="left:10%; animation-delay:0s;">💗</span>
    <span class="heart" style="left:25%; animation-delay:2s;">💕</span>
    <span class="heart" style="left:45%; animation-delay:4s;">💖</span>
    <span class="heart" style="left:65%; animation-delay:1s;">💗</span>
    <span class="heart" style="left:85%; animation-delay:3s;">💞</span>
</div>

<div class="card">

    <h1>💗 oii gatinhaa 💗</h1>

    <div class="subtitle">
        volta amor 😭
    </div>

    <div class="love">
        EU AMO VOCÊ 🥺💕
    </div>

    <div class="saudade">
        e tô com saudades 😭🫂
    </div>

    <button onclick="mostrar('💗 EU TE AMO MUITO 💗')">
        💗 eu te amo
    </button>

    <button onclick="mostrar('🥺 vem me dar beijinho')">
        🥺 beijinho
    </button>

    <button onclick="mostrar('🫂 queria você aqui comigo')">
        🫂 quero você
    </button>

    <div id="mensagem"></div>

    <div class="assinatura">
        🐻<br>
        🩷 🎀 💕 🧸 💗
    </div>

</div>

<script>
function mostrar(texto) {
    const mensagem = document.getElementById("mensagem");
    mensagem.innerHTML = texto;

    // Pequena chuva de corações ao clicar
    for (let i = 0; i < 8; i++) {
        const heart = document.createElement("div");
        heart.innerHTML = ["💗","💕","💖","💞"][Math.floor(Math.random()*4)];

        heart.style.position = "fixed";
        heart.style.left = (45 + Math.random()*10) + "%";
        heart.style.top = "55%";
        heart.style.fontSize = "25px";
        heart.style.zIndex = "5";
        heart.style.transition = "1.5s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.style.transform =
                `translate(${(Math.random()-0.5)*250}px, -250px)`;
            heart.style.opacity = "0";
        }, 50);

        setTimeout(() => heart.remove(), 1600);
    }
}
</script>

</body>
</html>
